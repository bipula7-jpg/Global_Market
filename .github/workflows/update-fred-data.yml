name: Update FRED Data

on:
  schedule:
    # FRED's Treasury spread and Fed Funds series update once per business
    # day, typically by late afternoon ET. Runs once daily on weekdays at
    # 21:30 UTC (~4:30–5:30pm ET depending on daylight saving).
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-fred-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred_data.py

      - name: Commit changes if any
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fred.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FRED data [automated]"
            git push
          fi
